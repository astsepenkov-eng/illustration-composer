<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Конструктор иллюстраций</title>
<style>
:root { color-scheme:light dark; font:13px/1.4 system-ui,sans-serif }
* { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; padding:16px; background:var(--figma-color-bg,#fff); color:var(--figma-color-text,#222) }
h1 { font-size:18px; margin:0 0 12px }
label { display:block; font-weight:550 }
select,textarea,button,input { font:inherit }
textarea,select,button { width:100%; margin:4px 0 8px; border:1px solid var(--figma-color-border,#bbb); border-radius:6px; padding:7px; color:inherit; background:var(--figma-color-bg-secondary,#f4f4f4) }
textarea { resize:vertical; min-height:64px }
button { cursor:pointer }
button.primary { background:var(--figma-color-bg-brand,#087bdc); color:var(--figma-color-text-onbrand,#fff); border-color:transparent; font-weight:650 }
button:disabled { opacity:.5; cursor:default }
.row { display:grid; grid-template-columns:1fr 1fr; gap:8px }
fieldset { margin:0 0 8px; padding:4px 8px; border:1px solid var(--figma-color-border,#bbb); border-radius:6px }
legend { padding:0 4px; font-weight:550 }
#subjects { max-height:165px; overflow:auto }
.subject { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:8px }
.subject select { margin:3px 0 }
#previewStatus { margin:2px 0 4px }
small { display:block; color:var(--figma-color-text-secondary,#555) }
details { margin-top:9px }
summary { cursor:pointer }
#issues { white-space:pre-wrap; overflow:auto; max-height:100px }
#status { margin:8px 0 0; min-height:18px; overflow-wrap:anywhere }
#status.error { color:var(--figma-color-text-danger,#aa2424) }
#download { display:inline-block; color:var(--figma-color-text-brand,#087bdc); margin-top:5px }
#download[hidden] { display:none }
</style>
<h1>Конструктор иллюстраций</h1>
<form id="composer">
  <label>Подбор предметов
    <select id="mode"><option value="names">По названиям</option><option value="meaning">По заголовку или метафоре</option></select>
  </label>
  <label>Запрос <textarea id="query" placeholder="Книга, телефон" maxlength="250" required></textarea></label>
  <div class="row" id="queryPicker">
    <select id="querySubject" aria-label="Предмет из библиотеки"></select>
    <button type="button" id="appendQuery" disabled>Добавить в запрос</button>
  </div>
  <small id="meaningHelp" hidden>Например, «Библиотека в кармане» подберёт книгу и телефон. Затем можно выбрать роли.</small>
  <div class="row">
    <label>Детализация <select id="size"><option>L</option><option>S</option></select></label>
    <label>Формат
      <select id="format"><option value="wide">Горизонтальный</option><option value="square">Квадрат</option><option value="vertical">Вертикальный</option></select>
    </label>
  </div>
  <label>Палитра
    <select id="palette">
      <option value="">Исходные цвета</option><option value="0">Сиреневая</option><option value="1">Персиковая</option><option value="2">Бирюзовая</option>
    </select>
  </label>
  <fieldset id="roles" hidden>
    <legend>Роли предметов</legend>
    <small id="previewStatus" role="status"></small>
    <div id="subjects"></div>
  </fieldset>
  <button class="primary" id="build" disabled>Собрать композицию</button>
</form>
<div class="row">
  <button id="paletteAction" disabled>Применить палитру</button>
  <button id="role" disabled>Сменить роль предмета</button>
</div>
<button id="formatAction" disabled>Применить выбранный формат к композиции</button>
<button id="export" disabled>Подготовить SVG</button>
<a id="download" hidden>Скачать SVG</a>
<p id="status" role="status" aria-live="polite"></p>
<details>
  <summary>Библиотека и импорт палитры</summary>
  <div class="row">
    <label>Предмет <select id="subject"></select></label>
    <label>Роль <select id="addRole"><option value="main">Главный</option><option value="background">Фоновый</option></select></label>
  </div>
  <button id="add" disabled>Добавить в выбранную композицию</button>
  <button id="examples" disabled>Собрать три примера</button>
  <label>Палитра в JSON <input id="import" type="file" accept=".json,application/json"></label>
  <button id="scan">Обновить каталог</button>
  <small id="catalog">Загружаю каталог…</small>
  <small id="schemeColors"></small>
  <small id="issues"></small>
</details>
<script>
const $=id=>document.getElementById(id);
let catalogCount=0, busy=false, custom=null, schemes=[], svgURL=null;
let namesBySize={L:[],S:[]};
let selectionItems=[];
let previewId=0, previewTimer, previewItems=[];
const chosenRoles=new Map();
function status(text,error=false) {
  $('status').textContent=text;
  $('status').className=error?'error':'';
}
function updateButtons() {
  $('scan').disabled=busy;
  for (const id of ['role','export','paletteAction','examples']) $(id).disabled=busy||!catalogCount;
  $('formatAction').disabled=busy||!selectionItems.length;
  $('add').disabled=busy||!$('subject').value;
  $('build').disabled=busy||!catalogCount||!previewItems.length;
  $('appendQuery').disabled=busy||!$('querySubject').value;
}
function updateAddRole() {
  const subject=selectionItems.find(item=>item.name===$('subject').value);
  const select=$('addRole');
  const background=select.options[1];
  background.disabled=!subject?.background;
  background.textContent=subject?.background?'Фоновый':'Фон недоступен';
  select.disabled=!subject;
  if (background.disabled) select.value='main';
  updateButtons();
}
function updateQueryPicker() {
  const mode=$('mode').value;
  $('queryPicker').hidden=mode!=='names';
  $('meaningHelp').hidden=mode==='names';
  const select=$('querySubject');
  const current=select.value;
  const names=namesBySize[$('size').value];
  select.replaceChildren(new Option('Выбрать из библиотеки',''),...names.map(name=>new Option(name,name)));
  if (names.includes(current)) select.value=current;
  updateButtons();
}
function requestPreview() {
  clearTimeout(previewTimer);
  const id=++previewId;
  const query=$('query').value.trim();
  previewItems=[];
  $('subjects').replaceChildren();
  const show=Boolean(query&&catalogCount);
  $('roles').hidden=!show;
  $('previewStatus').textContent=show?'Подбираю предметы…':'';
  updateButtons();
  if (!show) {
    if (!query) chosenRoles.clear();
    return;
  }
  previewTimer=setTimeout(()=>parent.postMessage({pluginMessage:{
    type:'preview',id,query,mode:$('mode').value,size:$('size').value
  }},'*'),160);
}
function renderPreview(message) {
  if (message.id!==previewId) return;
  $('previewStatus').textContent=message.error||'';
  const counts=new Map();
  previewItems=(message.items||[]).map(item=>{
    const occurrence=(counts.get(item.name)||0)+1;
    counts.set(item.name,occurrence);
    const key=item.name+' '+occurrence;
    const row=document.createElement('label');
    row.className='subject';
    row.append(document.createTextNode(item.name));
    const select=document.createElement('select');
    select.setAttribute('aria-label','Роль: '+item.name+(occurrence>1?' '+occurrence:''));
    select.append(new Option(item.background?'Главный':'Главный · фон недоступен','main'));
    if (item.background) select.append(new Option('Фоновый','background'));
    select.disabled=!item.background;
    select.value=item.background?(chosenRoles.get(key)||'main'):'main';
    select.onchange=()=>chosenRoles.set(key,select.value);
    row.append(select);
    $('subjects').append(row);
    return select;
  });
  updateButtons();
}
function send(type,data={}) {
  if (busy) return;
  busy=true;
  status('Выполняю…');
  updateButtons();
  parent.postMessage({pluginMessage:{type,...data}},'*');
}
function getPalette() {
  const value=$('palette').value;
  if (value==='custom') return custom;
  return value===''?null:schemes[Number(value)];
}
function clearDownload() {
  if (svgURL) URL.revokeObjectURL(svgURL);
  svgURL=null;
  $('download').hidden=true;
}
$('composer').onsubmit=event=>{
  event.preventDefault();
  clearDownload();
  if (!previewItems.length) return;
  send('build',{query:$('query').value,mode:$('mode').value,size:$('size').value,format:$('format').value,palette:getPalette(),roles:previewItems.map(select=>select.value)});
};
$('query').oninput=requestPreview;
$('size').onchange=()=>{updateQueryPicker();requestPreview();};
$('querySubject').onchange=updateButtons;
$('appendQuery').onclick=()=>{
  const name=$('querySubject').value;
  if (!name) return;
  const query=$('query').value.trim().replace(/[,;]+$/,'').trimEnd();
  if (query.split(/[,;\n]+/).filter(item=>item.trim()).length>=6) {
    status('В одном запросе можно указать до шести предметов.',true);
    return;
  }
  $('query').value=query?query+', '+name:name;
  $('querySubject').value='';
  status('');
  requestPreview();
};
$('mode').onchange=()=>{
  $('query').placeholder=$('mode').value==='names'?'Книга, телефон':'Учёба всегда под рукой';
  updateQueryPicker();
  requestPreview();
};
$('paletteAction').onclick=()=>{clearDownload();send('palette',{palette:getPalette()});};
$('role').onclick=()=>{clearDownload();send('role');};
$('subject').onchange=updateAddRole;
$('add').onclick=()=>{clearDownload();send('add',{name:$('subject').value,role:$('addRole').value});};
$('formatAction').onclick=()=>{clearDownload();send('format',{format:$('format').value});};
$('examples').onclick=()=>{clearDownload();send('examples');};
$('scan').onclick=()=>send('scan');
$('export').onclick=()=>{clearDownload();send('export');};
$('import').onchange=async event=>{
  try {
    const file=event.target.files[0];
    if (!file) return;
    if (file.size>4096) throw Error('Файл палитры слишком большой.');
    const data=JSON.parse(await file.text());
    const hex=x=>typeof x==='string'&&/^#[\da-f]{6}$/i.test(x);
    if (!data || typeof data.name!=='string' || !data.name.trim() || !hex(data.canvas) ||
        !['background','objects'].every(k=>Array.isArray(data[k])&&data[k].length===4&&data[k].every(hex)))
      throw Error('Ожидается JSON с name, canvas и четырьмя HEX-цветами в background и objects.');
    custom=data;
    const option=[...$('palette').options].find(o=>o.value==='custom')||$('palette').appendChild(new Option('', 'custom'));
    option.textContent=custom.name;
    $('palette').value='custom';
    status('Палитра загружена. Примените её к выбранной композиции или соберите новую.');
  } catch(error) { status(error.message,true); }
  finally { event.target.value=''; }
};
onmessage=event=>{
  const message=event.data.pluginMessage;
  if (!message) return;
  if (message.type==='catalog') {
    catalogCount=message.count;
    schemes=message.schemes;
    namesBySize=message.namesBySize;
    $('catalog').textContent=message.count+' вариантов · '+message.names.join(', ')+
      (message.sourcePalettes?' · Палитры прочитаны из Figma':'');
    $('schemeColors').textContent=message.sourcePalettes?schemes.map(p=>p.name+' '+p.canvas).join(' · '):'';
    $('issues').textContent=message.issues.join('\n');
    status(message.issues.length?'Каталог собран. Замечания доступны в разделе «Библиотека и импорт палитры».':'Каталог собран.');
    updateQueryPicker();
    requestPreview();
  }
  if (message.type==='selection') {
    selectionItems=message.items;
    const subject=$('subject');
    const previous=subject.value;
    subject.replaceChildren(new Option(selectionItems.length?'Выбрать предмет':'Выделите композицию',''),
      ...selectionItems.map(item=>new Option(item.name,item.name)));
    if (selectionItems.some(item=>item.name===previous)) subject.value=previous;
    updateAddRole();
  }
  if (message.type==='preview') renderPreview(message);
  if (message.type==='status') status(message.text,message.error);
  if (message.type==='svg') {
    svgURL=URL.createObjectURL(new Blob([message.raw],{type:'image/svg+xml;charset=utf-8'}));
    $('download').href=svgURL;
    $('download').download=message.name;
    $('download').hidden=false;
    status('SVG готов к скачиванию.');
  }
  if (message.type==='ready') {busy=false;updateButtons();}
};
send('scan');
</script>
